<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Multi Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .hidden { display: none; }
        .login-box { max-width: 400px; margin: 80px auto; background: #1e293b; padding: 30px; border-radius: 10px; border: 1px solid #334155; }
        .login-box h3 { margin-top: 0; text-align: center; color: #38bdf8; }
        input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #334155; text-align: left; }
        th { background: #0284c7; }
        .error { color: #f87171; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- MFA Admin Login Screen -->
    <div id="login-container" class="login-box">
        <h3>Admin Multi-Verification</h3>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <input type="password" id="secureKey" placeholder="Enter Secure Key" />
        <button id="loginBtn">Verify & Login</button>
        <p id="errorMsg" class="error"></p>
    </div>

    <!-- Admin Dashboard Screen -->
    <div id="dashboard-container" class="hidden">
        <h2>Secure Meeting Logs & Browser Data</h2>
        <button id="logoutBtn" style="width: 120px; background: #ef4444; float: right;">Logout</button>
        <br><br>
        <table>
            <thead>
                <tr>
                    <th>Meeting ID</th>
                    <th>Socket ID</th>
                    <th>Browser Agent Data</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody id="logTableBody"></tbody>
        </table>
    </div>

    <script>
        const loginContainer = document.getElementById('login-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const errorMsg = document.getElementById('errorMsg');

        loginBtn.addEventListener('click', async () => {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const secureKey = document.getElementById('secureKey').value.trim();

            errorMsg.innerText = '';

            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, secureKey })
            });

            const data = await res.json();

            if (data.success) {
                loginContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                loadLogs();
            } else {
                errorMsg.innerText = data.message;
            }
        });

        async function loadLogs() {
            const res = await fetch('/api/logs');
            if (res.status === 401 || res.status === 403) {
                loginContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
                return;
            }
            const logs = await res.json();
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            logs.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${log.roomId}</td>
                    <td>${log.socketId}</td>
                    <td><small>${log.userAgent}</small></td>
                    <td>${new Date(log.timestamp).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        logoutBtn.addEventListener('click', async () => {
            await fetch('/api/admin/logout', { method: 'POST' });
            location.reload();
        });
    </script>
</body>
</html>
