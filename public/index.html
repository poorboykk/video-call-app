<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Video Call</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .hidden { display: none; }
        #setup-box { margin-top: 100px; }
        input, button { padding: 10px 15px; font-size: 16px; border-radius: 5px; border: none; margin: 5px; }
        button { background: #3b82f6; color: white; cursor: pointer; }
        button:hover { background: #2563eb; }
        .video-grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        video { width: 400px; height: 300px; background: #000; border-radius: 8px; border: 2px solid #334155; }
    </style>
</head>
<body>

    <div id="setup-box">
        <h2>Secured Video Call</h2>
        <p>Enter a Meeting ID to start</p>
        <input type="text" id="roomIdInput" placeholder="Enter Meeting ID..." />
        <br>
        <button id="joinBtn">Join Meeting</button>
    </div>

    <div id="video-box" class="hidden">
        <h3 id="roomTitle"></h3>
        <div class="video-grid">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <br>
        <button id="recordBtn" style="background: #ef4444;">Start Recording</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
